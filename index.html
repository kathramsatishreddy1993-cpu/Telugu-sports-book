<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Sports Book - Live</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .match-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            width: 100%;
            max-width: 400px;
        }

        .sport {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: bold;
        }

        .teams {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .score {
            font-size: 16px;
            color: #d32f2f;
            font-weight: bold;
        }

        .odds {
            display: flex;
            justify-content: space-between;
            background: #eee;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .odd-box {
            text-align: center;
        }

        .status {
            font-size: 12px;
            color: green;
            font-weight: bold;
        }

        .auth-loading {
            text-align: center;
            margin-top: 100px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="auth-loading">
            Checking login...
        </div>
    </div>

    <script>
        const AUTH_KEY = 'telugu_sports_auth_user';

        /*
         * LOGIN CHECK
         * If user is not logged in, send them to login.html.
         */
        function checkAuthentication() {
            const storedUser = localStorage.getItem(AUTH_KEY);

            if (!storedUser) {
                window.location.replace('/login.html');
                return false;
            }

            try {
                const user = JSON.parse(storedUser);

                if (!user || !user.isAuthenticated) {
                    localStorage.removeItem(AUTH_KEY);
                    window.location.replace('/login.html');
                    return false;
                }

                return true;

            } catch (error) {
                localStorage.removeItem(AUTH_KEY);
                window.location.replace('/login.html');
                return false;
            }
        }


        /*
         * MAIN SPORTS APP
         * Only runs after successful login.
         */
        async function startSportsApp() {

            document.getElementById('app').innerHTML = `
                <h1>🏏 Telugu Sports Book Live</h1>

                <div style="text-align:center; margin-bottom:20px;">
                    <button
                        onclick="logout()"
                        style="
                            background:#d32f2f;
                            color:white;
                            border:none;
                            padding:10px 18px;
                            border-radius:6px;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        Logout
                    </button>
                </div>

                <div class="container" id="matches">
                    <p>Loading live matches...</p>
                </div>
            `;

            fetchMatches();

            setInterval(fetchMatches, 10000);
        }


        async function fetchMatches() {

            try {

                const response = await fetch('/api/sports/events');

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const result = await response.json();

                const container = document.getElementById('matches');

                if (!container) return;

                container.innerHTML = '';

                if (
                    result.success &&
                    Array.isArray(result.data) &&
                    result.data.length > 0
                ) {

                    result.data.forEach(event => {

                        const card = document.createElement('div');

                        card.className = 'match-card';

                        card.innerHTML = `
                            <div class="sport">
                                ${event.sport || 'Sport'} -
                                ${event.league || 'Live'}
                            </div>

                            <div class="teams">
                                ${event.homeTeam || 'Home'} vs
                                ${event.awayTeam || 'Away'}
                            </div>

                            <div class="score">
                                ${event.score || '-'}
                            </div>

                            <div class="status">
                                ${event.status || 'LIVE'}
                            </div>

                            <div class="odds">

                                <div class="odd-box">
                                    <strong>Home</strong>
                                    <br>
                                    ${event.odds?.home || '-'}
                                </div>

                                <div class="odd-box">
                                    <strong>Away</strong>
                                    <br>
                                    ${event.odds?.away || '-'}
                                </div>

                                ${
                                    event.odds?.draw
                                    ? `
                                        <div class="odd-box">
                                            <strong>Draw</strong>
                                            <br>
                                            ${event.odds.draw}
                                        </div>
                                    `
                                    : ''
                                }

                            </div>
                        `;

                        container.appendChild(card);
                    });

                } else {

                    container.innerHTML =
                        '<p>No live matches right now.</p>';
                }

            } catch (error) {

                console.error('Error fetching matches:', error);

                const container = document.getElementById('matches');

                if (container) {
                    container.innerHTML =
                        '<p>Error loading matches. Please try again later.</p>';
                }
            }
        }


        /*
         * LOGOUT
         */
        function logout() {

            localStorage.removeItem(AUTH_KEY);
            sessionStorage.removeItem(AUTH_KEY);

            window.location.replace('/login.html');
        }


        /*
         * START
         */
        if (checkAuthentication()) {
            startSportsApp();
        }
    </script>

</body>
</html>
